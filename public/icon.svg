<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Silver Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#dropShadow)"/>

  <!-- Vault Precision Dial Rings -->
  <circle cx="256" cy="236" r="184" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  <circle cx="256" cy="236" r="162" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="236" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Dual-Custody Interlocking Keys (Antique Heraldic Cross) -->
  <g filter="url(#dropShadow)" opacity="0.95">
    <!-- Key 1 (Top-Left to Bottom-Right) -->
    <g transform="translate(256, 236) rotate(45) translate(-256, -236)">
      <circle cx="160" cy="236" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
      <circle cx="160" cy="236" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <rect x="188" y="232" width="136" height="8" rx="4" fill="url(#goldGrad)"/>
      <rect x="290" y="240" width="10" height="20" rx="2" fill="url(#goldGrad)"/>
      <rect x="306" y="240" width="10" height="26" rx="2" fill="url(#goldGrad)"/>
      <rect x="314" y="222" width="10" height="10" rx="2" fill="url(#goldGrad)"/>
    </g>

    <!-- Key 2 (Top-Right to Bottom-Left) -->
    <g transform="translate(256, 236) rotate(-45) translate(-256, -236)">
      <circle cx="160" cy="236" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
      <circle cx="160" cy="236" r="12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <rect x="188" y="232" width="136" height="8" rx="4" fill="url(#goldGrad)"/>
      <rect x="290" y="240" width="10" height="20" rx="2" fill="url(#goldGrad)"/>
      <rect x="306" y="240" width="10" height="26" rx="2" fill="url(#goldGrad)"/>
      <rect x="314" y="222" width="10" height="10" rx="2" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Heraldic Shield Central Base -->
  <path d="M 256 120 C 330 120, 360 148, 360 216 C 360 300, 290 350, 256 372 C 222 350, 152 300, 152 216 C 152 148, 182 120, 256 120 Z"
        fill="#042f2e" stroke="url(#goldGrad)" stroke-width="5" filter="url(#dropShadow)"/>

  <!-- Inner Architectural Facade (Neoclassical Bank Columns) -->
  <g fill="url(#steelGrad)">
    <!-- Pediment -->
    <path d="M 256 142 L 334 182 L 178 182 Z"/>
    <!-- Capital Bar -->
    <rect x="184" y="184" width="144" height="6" rx="2"/>
    <!-- 4 Bank Pillars -->
    <rect x="194" y="194" width="14" height="68" rx="2"/>
    <rect x="226" y="194" width="14" height="68" rx="2"/>
    <rect x="272" y="194" width="14" height="68" rx="2"/>
    <rect x="304" y="194" width="14" height="68" rx="2"/>
    <!-- Base Steps -->
    <rect x="180" y="266" width="152" height="8" rx="2"/>
    <rect x="170" y="278" width="172" height="10" rx="2"/>
  </g>

  <!-- Central Seal Monogram: EG in Polished Gold -->
  <circle cx="256" cy="230" r="32" fill="#022c22" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropShadow)"/>
  <text x="256" y="240" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">EG</text>

  <!-- Institutional Typography at Bottom -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="256" y="420" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="5">SIINQEE BANK</text>
    <text x="256" y="444" font-weight="700" font-size="12" fill="url(#goldGrad)" letter-spacing="3">DUAL-CUSTODY OPERATIONS</text>
  </g>
</svg>
